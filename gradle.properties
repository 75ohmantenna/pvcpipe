android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=1024M --add-opens jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED
systemProp.file.encoding=utf-8
# always set testOnly to false in gradle.properties to get debug builds installed
android.injected.testOnly=false

# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# https://docs.gradle.org/current/userguide/performance.html#parallel_execution
org.gradle.parallel=false
org.gradle.workers.max=1
# Avoid a second compiler JVM on memory-constrained development machines.
kotlin.compiler.execution.strategy=in-process
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
